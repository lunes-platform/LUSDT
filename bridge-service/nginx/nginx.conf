upstream bridge_service {
    server bridge-service:3000;
}

server {
    listen 80;
    server_name _;

    # Redirecionar HTTP → HTTPS em produção
    # return 301 https://$host$request_uri;

    # Para desenvolvimento local, proxy direto
    location / {
        proxy_pass http://bridge_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://bridge_service/health;
        access_log off;
    }

    location /metrics {
        proxy_pass http://bridge_service/metrics;
        # Restringir acesso às métricas em produção
        # allow 10.0.0.0/8;
        # deny all;
    }
}

